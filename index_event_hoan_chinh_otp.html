<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;

    background:
        radial-gradient(
            circle at top,
            #43216b 0%,
            #170d29 55%,
            #08050d 100%
        );
}

.container {
    width: min(1100px, 94%);
    margin: auto;
    padding: 30px 0 60px;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    opacity: .8;
    margin-bottom: 25px;
}

.panel {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
}

.hidden {
    display: none !important;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 0;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

.main-btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #ffb300;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.main-btn:disabled {
    opacity: .6;
    cursor: wait;
}

.status {
    text-align: center;
    min-height: 24px;
    margin-top: 14px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: rgba(0,0,0,.25);
    border-radius: 14px;
    padding: 15px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 28px;
    margin-top: 5px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
}

.card {
    min-height: 150px;
    border: 0;
    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #7438c8,
            #251040
        );

    color: white;
    cursor: pointer;

    transition:
        transform .2s,
        opacity .2s;
}

.card:hover:not(:disabled) {
    transform: translateY(-4px);
}

.card:disabled {
    cursor: not-allowed;
    opacity: .7;
}

.card.flipped {
    background:
        linear-gradient(
            145deg,
            #f3a600,
            #713500
        );
}

.card-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 150px;
}

.card-symbol {
    font-size: 42px;
}

.result {
    font-size: 28px;
    font-weight: bold;
}

.note {
    margin-top: 7px;
}

.leaderboard {
    width: 100%;
    border-collapse: collapse;
}

.leaderboard th,
.leaderboard td {
    padding: 11px;
    border-bottom:
        1px solid rgba(255,255,255,.1);
}

.leaderboard th {
    text-align: left;
}

.event-closed {
    text-align: center;
    padding: 35px 15px;
}

.event-closed strong {
    display: block;
    font-size: 24px;
    margin-bottom: 10px;
}

@media(max-width:700px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

</style>

</head>

<script>

const SUPABASE_URL =
    "https://rftnjeozezxgemtrvkce.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_SQS8AB9rBORo8KUSL0KtPw_mydlG5aw";

const ADMIN_EMAIL =
    "namtruong3333@gmail.com";


const EVENT_START =
    new Date("2026-10-04T17:00:00Z");

const EVENT_END =
    new Date("2026-10-10T16:59:59Z");


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


const loginPanel =
    document.getElementById(
        "loginPanel"
    );

const otpPanel =
    document.getElementById(
        "otpPanel"
    );

const gamePanel =
    document.getElementById(
        "gamePanel"
    );

const eventClosed =
    document.getElementById(
        "eventClosed"
    );

const eventClosedTitle =
    document.getElementById(
        "eventClosedTitle"
    );

const eventClosedText =
    document.getElementById(
        "eventClosedText"
    );

const emailInput =
    document.getElementById(
        "emailInput"
    );

const otpInput =
    document.getElementById(
        "otpInput"
    );

const sendOtpBtn =
    document.getElementById(
        "sendOtpBtn"
    );

const verifyOtpBtn =
    document.getElementById(
        "verifyOtpBtn"
    );

const loginStatus =
    document.getElementById(
        "loginStatus"
    );

const otpStatus =
    document.getElementById(
        "otpStatus"
    );

const gameStatus =
    document.getElementById(
        "gameStatus"
    );

const playsEl =
    document.getElementById(
        "plays"
    );

const pointsEl =
    document.getElementById(
        "points"
    );

const leaderboardBody =
    document.getElementById(
        "leaderboardBody"
    );


let currentEmail = "";

let loggedIn = false;

let busy = false;


/* ============================================================
   EVENT STATUS
============================================================ */

function updateEventDisplay() {

    const now =
        new Date();


    if (now < EVENT_START) {

        eventClosed.classList.remove(
            "hidden"
        );

        eventClosedTitle.textContent =
            "⏳ SỰ KIỆN CHƯA BẮT ĐẦU";

        eventClosedText.textContent =
            "Sự kiện bắt đầu lúc 00:00 ngày 05/10/2026 theo giờ Việt Nam.";

        return false;
    }


    if (now > EVENT_END) {

        eventClosed.classList.remove(
            "hidden"
        );

        eventClosedTitle.textContent =
            "⛔ SỰ KIỆN ĐÃ KẾT THÚC";

        eventClosedText.textContent =
            "Cảm ơn bạn đã tham gia sự kiện.";

        return false;
    }


    eventClosed.classList.add(
        "hidden"
    );

    return true;
}


function isEventOpen() {
    return (
        new Date() >= EVENT_START &&
        new Date() <= EVENT_END
    );
}


/* ============================================================
   LEADERBOARD
============================================================ */

async function loadLeaderboard() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "get_leaderboard"
            );


        if (error) {
            throw error;
        }


        leaderboardBody.innerHTML = "";


        if (!data || data.length === 0) {

            leaderboardBody.innerHTML = `
                <tr>
                    <td colspan="3">
                        Chưa có người chơi có điểm.
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(
            (player, index) => {

                const tr =
                    document.createElement(
                        "tr"
                    );


                const name =
                    document.createElement(
                        "td"
                    );

                const email =
                    document.createElement(
                        "td"
                    );

                const points =
                    document.createElement(
                        "td"
                    );


                name.textContent =
                    index + 1;

                email.textContent =
                    player.display_name ||
                    "Người chơi";

                points.textContent =
                    Number(
                        player.points || 0
                    );


                tr.appendChild(name);
                tr.appendChild(email);
                tr.appendChild(points);

                leaderboardBody.appendChild(
                    tr
                );

            }
        );

    } catch (error) {

        console.error(
            "Leaderboard:",
            error
        );

    }
}


/* ============================================================
   PLAYER STATE
============================================================ */

async function loadPlayerState() {

    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "get_player_state"
        );


    if (error) {
        throw error;
    }


    playsEl.textContent =
        String(
            data?.plays_remaining ?? 0
        );


    pointsEl.textContent =
        String(
            data?.points ?? 0
        );


    if (
        Number(
            data?.plays_remaining
        ) <= 0
    ) {

        disableCards();

        gameStatus.textContent =
            "⏳ Bạn đã dùng hết 50 lượt hôm nay.";

    }

}


/* ============================================================
   CARD HELPERS
============================================================ */

function getCards() {

    return [
        ...document.querySelectorAll(
            ".card"
        )
    ];

}


function disableCards() {

    getCards().forEach(
        card => {
            card.disabled = true;
        }
    );

}


function enableCards() {

    if (!loggedIn) {
        return;
    }

    if (
        !isEventOpen()
    ) {
        disableCards();
        return;
    }


    if (
        Number(
            playsEl.textContent
        ) <= 0
    ) {
        disableCards();
        return;
    }


    getCards().forEach(
        card => {

            if (
                !card.classList.contains(
                    "flipped"
                )
            ) {
                card.disabled = false;
            }

        }
    );

}


function resetCards() {

    getCards().forEach(
        card => {

            card.classList.remove(
                "flipped"
            );

            card.disabled =
                false;


            const result =
                card.querySelector(
                    ".result"
                );

            const note =
                card.querySelector(
                    ".note"
                );

            if (result) {
                result.textContent = "";
            }

            if (note) {
                note.textContent = "";
            }

        }
    );

}


function allCardsFlipped() {

    const cards =
        getCards();

    return (
        cards.length === 10 &&
        cards.every(
            card =>
                card.classList.contains(
                    "flipped"
                )
        )
    );

}


/* ============================================================
   SEND OTP
============================================================ */

sendOtpBtn.addEventListener(
    "click",
    async () => {

        if (!isEventOpen()) {

            loginStatus.textContent =
                "⏳ Sự kiện chưa bắt đầu.";

            return;
        }


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if (!email) {

            loginStatus.textContent =
                "⚠️ Vui lòng nhập email.";

            return;
        }


        currentEmail =
            email;


        sendOtpBtn.disabled =
            true;


        loginStatus.textContent =
            "⏳ Đang gửi OTP...";


        try {

            const {
                error
            } =
                await supabaseClient.auth
                    .signInWithOtp({
                        email: email,
                        options: {
                            shouldCreateUser: true
                        }
                    });


            if (error) {
                throw error;
            }


            otpPanel.classList.remove(
                "hidden"
            );


            loginStatus.textContent =
                "✅ Mã OTP đã được gửi tới email.";

        } catch (error) {

            console.error(error);

            loginStatus.textContent =
                "❌ " +
                (
                    error?.message ||
                    "Không thể gửi OTP."
                );

        } finally {

            sendOtpBtn.disabled =
                false;

        }

    }
);


/* ============================================================
   VERIFY OTP
============================================================ */

verifyOtpBtn.addEventListener(
    "click",
    async () => {

        if (!isEventOpen()) {

            otpStatus.textContent =
                "⏳ Sự kiện chưa bắt đầu.";

            return;
        }


        const email =
            currentEmail ||
            emailInput.value
                .trim()
                .toLowerCase();

        const token =
            otpInput.value.trim();


        if (!email) {

            otpStatus.textContent =
                "⚠️ Thiếu email.";

            return;
        }


        if (!token) {

            otpStatus.textContent =
                "⚠️ Vui lòng nhập mã OTP.";

            return;
        }


        verifyOtpBtn.disabled =
            true;


        otpStatus.textContent =
            "⏳ Đang xác minh...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .verifyOtp({
                        email: email,
                        token: token,
                        type: "email"
                    });


            if (error) {
                throw error;
            }


            if (!data?.session) {
                throw new Error(
                    "NO_SESSION"
                );
            }


            const userEmail =
                (
                    data.session.user.email ||
                    ""
                )
                .trim()
                .toLowerCase();


            if (
                userEmail !== email
            ) {
                throw new Error(
                    "EMAIL_MISMATCH"
                );
            }


            /*
             * Ghi nhận OTP hôm nay
             * ở Edge Function.
             */

            const {
                data: verifyResult,
                error: verifyError
            } =
                await supabaseClient
                    .functions
                    .invoke(
                        "verify-event-otp-2026",
                        {
                            body: {
                                email: email
                            }
                        }
                    );


            if (verifyError) {
                throw verifyError;
            }


            if (
                !verifyResult?.ok
            ) {
                throw new Error(
                    verifyResult?.error ||
                    "OTP_VERIFY_FAILED"
                );
            }


            loggedIn = true;


            loginPanel.classList.add(
                "hidden"
            );

            otpPanel.classList.add(
                "hidden"
            );

            gamePanel.classList.remove(
                "hidden"
            );


            otpStatus.textContent =
                "✅ Xác minh thành công.";


            await loadPlayerState();

            await loadLeaderboard();

            enableCards();


        } catch (error) {

            console.error(
                "OTP:",
                error
            );


            otpStatus.textContent =
                "❌ " +
                (
                    error?.message ||
                    "OTP không hợp lệ."
                );

        } finally {

            verifyOtpBtn.disabled =
                false;

        }

    }
);


/* ============================================================
   FLIP
============================================================ */

async function flip(card) {

    if (!loggedIn) {
        return;
    }


    if (busy) {
        return;
    }


    if (
        card.classList.contains(
            "flipped"
        )
    ) {
        return;
    }


    if (!isEventOpen()) {

        gameStatus.textContent =
            "⏳ Sự kiện chưa bắt đầu.";

        disableCards();

        return;
    }


    if (
        Number(
            playsEl.textContent
        ) <= 0
    ) {

        gameStatus.textContent =
            "⏳ Bạn đã hết lượt hôm nay.";

        disableCards();

        return;
    }


    busy = true;

    disableCards();


    gameStatus.textContent =
        "⏳ Đang lật thẻ...";


    try {

        /*
         * KHÔNG random ở đây.
         * KHÔNG cộng điểm ở đây.
         *
         * Server quyết định tất cả.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .functions
                .invoke(
                    "flip-event-2026",
                    {
                        body: {}
                    }
                );


        if (error) {
            throw error;
        }


        if (!data?.ok) {

            throw new Error(
                data?.error ||
                "FLIP_FAILED"
            );

        }


        const result =
            data.result;


        if (!result) {
            throw new Error(
                "SERVER_NO_RESULT"
            );
        }


        const won =
            result.has_point === true;


        const awarded =
            Number(
                result.points_awarded || 0
            );


        card.classList.add(
            "flipped"
        );


        const symbol =
            card.querySelector(
                ".card-symbol"
            );

        const resultEl =
            card.querySelector(
                ".result"
            );

        const noteEl =
            card.querySelector(
                ".note"
            );


        if (symbol) {
            symbol.textContent =
                "⭐";
        }


        if (resultEl) {

            resultEl.textContent =
                won
                    ? "+" + awarded
                    : "0";

        }


        if (noteEl) {

            noteEl.textContent =
                won
                    ? "🎉 Có điểm!"
                    : "😢 Không có điểm";

        }


        playsEl.textContent =
            String(
                result.plays_remaining
            );


        pointsEl.textContent =
            String(
                result.points
            );


        gameStatus.textContent =
            won
                ? "🎉 Bạn nhận +" +
                  awarded +
                  " điểm!"
                : "😢 Lần này không có điểm.";


        await loadLeaderboard();


        if (
            Number(
                result.plays_remaining
            ) <= 0
        ) {

            gameStatus.textContent =
                "⏳ Bạn đã dùng hết 50 lượt hôm nay.";

            disableCards();

            busy = false;

            return;
        }


        /*
         * ĐỦ 10 THẺ:
         *
         * CHỈ reset giao diện.
         *
         * Database vẫn giữ số lượt thật.
         */

        if (
            allCardsFlipped()
        ) {

            gameStatus.textContent =
                "✨ Đã lật đủ 10 thẻ. Vòng mới...";


            setTimeout(
                () => {

                    resetCards();

                    busy = false;

                    enableCards();

                    gameStatus.textContent =
                        "🃏 Tiếp tục lật thẻ.";

                },
                700
            );

        } else {

            busy = false;

            enableCards();

        }


    } catch (error) {

        console.error(
            "FLIP:",
            error
        );


        busy = false;


        const message =
            String(
                error?.message || ""
            );


        if (
            message.includes(
                "OTP_CHUA_XAC_NHAN_HOM_NAY"
            )
        ) {

            loggedIn = false;

            disableCards();

            await supabaseClient.auth
                .signOut();

            gamePanel.classList.add(
                "hidden"
            );

            loginPanel.classList.remove(
                "hidden"
            );

            otpPanel.classList.remove(
                "hidden"
            );

            otpStatus.textContent =
                "🔐 Bạn cần xác minh OTP mới hôm nay.";

            return;
        }


        if (
            message.includes(
                "IP_ALREADY_USED_BY_ANOTHER_ACCOUNT"
            ) ||
            message.includes(
                "IP_ALREADY_BOUND_TO_ANOTHER_ACCOUNT"
            )
        ) {

            gameStatus.textContent =
                "🚫 IP này đã được sử dụng bởi tài khoản khác.";

            return;
        }


        if (
            message.includes(
                "DA_DUNG_HET_50_LUOT"
            )
        ) {

            playsEl.textContent =
                "0";

            disableCards();

            gameStatus.textContent =
                "⏳ Bạn đã dùng hết 50 lượt hôm nay.";

            return;
        }


        if (
            message.includes(
                "EVENT_NOT_STARTED"
            )
        ) {

            gameStatus.textContent =
                "⏳ Sự kiện chưa bắt đầu.";

            disableCards();

            return;
        }


        if (
            message.includes(
                "EVENT_ENDED"
            )
        ) {

            gameStatus.textContent =
                "⛔ Sự kiện đã kết thúc.";

            disableCards();

            return;
        }


        gameStatus.textContent =
            "❌ " +
            (
                error?.message ||
                "Không thể lật thẻ."
            );


        enableCards();

    }

}


/* ============================================================
   CARD EVENTS
============================================================ */

getCards().forEach(
    card => {

        card.addEventListener(
            "click",
            () => flip(card)
        );

    }
);


/* ============================================================
   SESSION
============================================================ */

async function restoreSession() {

    try {

        const {
            data
        } =
            await supabaseClient.auth
                .getSession();


        const session =
            data?.session;


        /*
         * Chưa đăng nhập
         */

        if (!session?.user) {

            loginPanel.classList.remove(
                "hidden"
            );

            gamePanel.classList.add(
                "hidden"
            );

            return;
        }


        const email =
            (
                session.user.email ||
                ""
            )
            .trim()
            .toLowerCase();


        currentEmail =
            email;


        /*
         * ADMIN
         */

        if (
            email === ADMIN_EMAIL
        ) {

            loggedIn = true;

            loginPanel.classList.add(
                "hidden"
            );

            otpPanel.classList.add(
                "hidden"
            );

            gamePanel.classList.remove(
                "hidden"
            );


            await loadPlayerState();

            await loadLeaderboard();

            enableCards();

            return;
        }


        /*
         * NGƯỜI CHƠI:
         * kiểm tra OTP hôm nay.
         */

        const {
            data: otpToday,
            error: otpCheckError
        } =
            await supabaseClient
                .rpc(
                    "has_event_otp_today",
                    {
                        p_user_id:
                            session.user.id
                    }
                );


        if (otpCheckError) {
            throw otpCheckError;
        }


        if (!otpToday) {

            loggedIn = false;

            disableCards();

            loginPanel.classList.add(
                "hidden"
            );

            gamePanel.classList.add(
                "hidden"
            );

            otpPanel.classList.remove(
                "hidden"
            );

            otpStatus.textContent =
                "🔐 Sang ngày mới. Bạn cần xác minh OTP mới.";

            return;
        }


        loggedIn = true;


        loginPanel.classList.add(
            "hidden"
        );

        otpPanel.classList.add(
            "hidden"
        );

        gamePanel.classList.remove(
            "hidden"
        );


        await loadPlayerState();

        await loadLeaderboard();

        enableCards();


    } catch (error) {

        console.error(
            "SESSION:",
            error
        );

    }

}


/* ============================================================
   START
============================================================ */

updateEventDisplay();

loadLeaderboard();

restoreSession();

</script>
