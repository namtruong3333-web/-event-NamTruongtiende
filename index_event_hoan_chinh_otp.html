<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐉 LẬT THẺ TIÊN ĐẾ 2026</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#402060 0,#160b22 45%,#0b0610 100%);
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(720px,100%);
    margin:auto;
    padding:25px 15px 50px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.title{
    font-size:clamp(30px,8vw,52px);
    font-weight:900;
    margin:0;
}

.subtitle{
    margin-top:10px;
    color:#ddd;
    font-size:20px;
    font-weight:700;
}

.panel{
    background:rgba(38,21,55,.95);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.hidden{
    display:none!important;
}

.login-title{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:10px;
}

.login-text{
    text-align:center;
    color:#d9cce4;
    line-height:1.5;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid #6d4b85;
    background:#130a1b;
    color:#fff;
    font-size:17px;
    outline:none;
}

button{
    border:0;
    border-radius:14px;
    padding:14px 18px;
    background:linear-gradient(135deg,#873ee0,#4b1e83);
    color:white;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.full{
    width:100%;
    margin-top:14px;
}

.message{
    min-height:24px;
    text-align:center;
    margin-top:14px;
    line-height:1.45;
}

.error{
    color:#ff8c8c;
}

.success{
    color:#72efaa;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.stat{
    text-align:center;
    background:#160c20;
    border-radius:18px;
    padding:17px;
}

.stat-title{
    color:#d8cde0;
    font-size:17px;
}

.stat-value{
    font-size:38px;
    font-weight:900;
    margin-top:5px;
}

.instruction{
    text-align:center;
    font-size:20px;
    margin:15px 0 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    min-height:160px;
    border-radius:22px;
    background:
        linear-gradient(145deg,#7b3bd0,#32145d);
    border:2px solid rgba(255,255,255,.12);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    transition:.15s;
}

.card:active{
    transform:scale(.96);
}

.card.revealed{
    background:linear-gradient(145deg,#a15dea,#51277f);
}

.points{
    font-size:32px;
    font-weight:900;
}

.win{
    color:#ffd84d;
}

.zero{
    color:#ddd;
}

.top-title{
    font-size:28px;
    font-weight:900;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px 7px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

th:last-child,
td:last-child{
    text-align:right;
}

.logout{
    width:100%;
    margin-top:15px;
    background:transparent;
    border:1px solid rgba(255,255,255,.2);
}

@media(max-width:430px){

    .container{
        padding:20px 12px 40px;
    }

    .panel{
        padding:18px;
    }

    .card{
        min-height:140px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

<h1 class="title">
🐉 LẬT THẺ TIÊN ĐẾ
</h1>

<div class="subtitle">
SỰ KIỆN 05/10/2026 → 10/10/2026
</div>

</header>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPanel" class="panel">

<div class="login-title">
🔐 ĐĂNG NHẬP SỰ KIỆN
</div>

<div class="login-text">
Nhập email của bạn để nhận mã OTP.
<br>
Xác thực OTP xong mới được tham gia sự kiện.
</div>

<label>Email</label>

<input
    id="emailInput"
    type="email"
    autocomplete="email"
    placeholder="Nhập email của bạn"

<button
    id="sendOtpBtn"
    class="full"
>
📩 GỬI MÃ OTP
</button>

<div
    id="loginMessage"

</section>


<!-- =====================================================
     OTP
===================================================== -->

<section
    id="otpPanel"
    class="panel hidden"
>

<div class="login-title">
🔢 NHẬP MÃ OTP
</div>

<div class="login-text">
Mã OTP đã được gửi tới email của bạn.
</div>

<label>Mã OTP</label>

<input
    id="otpInput"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"

>
✅ XÁC NHẬN OTP
</button>

<button
    id="backBtn"
    class="full"

        background:transparent;
        border:1px solid rgba(255,255,255,.2);
    "
>
← QUAY LẠI
</button>

<div
    id="otpMessage"
    class="message"
></div>

</section>


<!-- =====================================================
     EVENT STATUS
===================================================== -->

<section
    id="statusPanel"
    class="panel hidden"
>

<div
    id="statusText"
    style="
        text-align:center;
        font-size:20px;
        line-height:1.6;
    "
></div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section
    id="gamePanel"
    class="panel hidden"
>

<div class="stats">

<div class="stat">

<div class="stat-title">
Lượt còn lại
</div>

<div
    id="playsRemaining"
    class="stat-value"
>
50
</div>

</div>


<div class="stat">

<div class="stat-title">
Tổng điểm
</div>

<div
    id="totalPoints"
    class="stat-value"
>
0
</div>

</div>

</div>


<div
    id="instruction"
    class="instruction"
>
Hãy lật thẻ.
</div>


<div
    id="cards"
    class="cards"
></div>


<div
    id="gameMessage"
    class="message"
></div>


<button
    id="logoutBtn"
    class="logout"
>
ĐĂNG XUẤT
</button>

</section>


<!-- =====================================================
     TOP 10
===================================================== -->

<section
    id="leaderboardPanel"
    class="panel hidden"
>

<div class="top-title">
🏆 TOP 10
</div>

<div id="leaderboard">
Đang tải...
</div>

</section>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://rftnjeozezxgemtrvkce.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_SQS8AB9rBORo8KUSL0KtPw_mydlG5aw";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   EVENT
===================================================== */

const ADMIN_EMAIL =
"namtruong3333@gmail.com";

const EVENT_START =
"2026-10-04T17:00:00Z";

const EVENT_END =
"2026-10-10T16:59:59Z";


const FLIP_FUNCTION =
"flip-event-2026";

const VERIFY_FUNCTION =
"verify-event-otp-2026";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let pendingEmail = "";

let isAdmin = false;

let flippedCards = 0;

let processing = false;


/* =====================================================
   ELEMENT
===================================================== */

const loginPanel =
document.getElementById("loginPanel");

const otpPanel =
document.getElementById("otpPanel");

const statusPanel =
document.getElementById("statusPanel");

const gamePanel =
document.getElementById("gamePanel");

const leaderboardPanel =
document.getElementById("leaderboardPanel");


/* =====================================================
   MESSAGE
===================================================== */

function message(
    id,
    text,
    type=""
){

    const el =
    document.getElementById(id);

    el.className =
    "message " + type;

    el.textContent =
    text || "";
}


/* =====================================================
   EVENT TIME
===================================================== */

function eventOpen(){

    const now =
    Date.now();

    return (
        now >= Date.parse(EVENT_START)
        &&
        now <= Date.parse(EVENT_END)
    );
}


function showEventStatus(){

    const now =
    Date.now();

    statusPanel.classList.remove("hidden");

    if(
        now <
        Date.parse(EVENT_START)
    ){

        document.getElementById(
            "statusText"
        ).innerHTML = `
            ⏳ <b>SỰ KIỆN CHƯA BẮT ĐẦU</b>
            <br><br>
            Sự kiện bắt đầu lúc
            <b>00:00 ngày 05/10/2026</b>
            theo giờ Việt Nam.
        `;

    }else{

        document.getElementById(
            "statusText"
        ).innerHTML = `
            🔒 <b>SỰ KIỆN ĐÃ KẾT THÚC</b>
            <br><br>
            Sự kiện kết thúc lúc
            <b>23:59:59 ngày 10/10/2026</b>
            theo giờ Việt Nam.
        `;
    }
}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    loginPanel.classList.remove("hidden");

    otpPanel.classList.add("hidden");

    statusPanel.classList.add("hidden");

    gamePanel.classList.add("hidden");

    leaderboardPanel.classList.add("hidden");
}


/* =====================================================
   SHOW OTP
===================================================== */

function showOtp(){

    loginPanel.classList.add("hidden");

    otpPanel.classList.remove("hidden");

    statusPanel.classList.add("hidden");

    gamePanel.classList.add("hidden");

    leaderboardPanel.classList.add("hidden");
}


/* =====================================================
   SHOW GAME
===================================================== */

function showGame(){

    loginPanel.classList.add("hidden");

    otpPanel.classList.add("hidden");

    statusPanel.classList.add("hidden");

    gamePanel.classList.remove("hidden");

    leaderboardPanel.classList.remove("hidden");
}


/* =====================================================
   SEND OTP
===================================================== */

async function sendOtp(){

    const email =
    document
    .getElementById("emailInput")
    .value
    .trim()
    .toLowerCase();


    if(!email){

        message(
            "loginMessage",
            "Vui lòng nhập email.",
            "error"
        );

        return;
    }


    document
    .getElementById("sendOtpBtn")
    .disabled = true;


    message(
        "loginMessage",
        "Đang gửi mã OTP..."
    );


    try{

        const {
            error
        } =
        await supabase.auth.signInWithOtp({

            email:email,

            options:{
                shouldCreateUser:true,

                emailRedirectTo:
                window.location.href
            }

        });


        if(error)
            throw error;


        pendingEmail =
        email;


        document
        .getElementById("otpInput")
        .value = "";


        showOtp();


        message(
            "otpMessage",
            "Mã OTP đã được gửi tới " + email,
            "success"
        );


    }catch(error){

        message(
            "loginMessage",
            error.message ||
            "Không thể gửi OTP.",
            "error"
        );

    }finally{

        document
        .getElementById("sendOtpBtn")
        .disabled = false;
    }
}


/* =====================================================
   VERIFY OTP
===================================================== */

async function verifyOtp(){

    const token =
    document
    .getElementById("otpInput")
    .value
    .trim();


    if(!pendingEmail){

        message(
            "otpMessage",
            "Thiếu email.",
            "error"
        );

        return;
    }


    if(!/^\d{6}$/.test(token)){

        message(
            "otpMessage",
            "Mã OTP phải gồm 6 chữ số.",
            "error"
        );

        return;
    }


    document
    .getElementById("verifyOtpBtn")
    .disabled = true;


    message(
        "otpMessage",
        "Đang xác thực..."
    );


    try{

        /*
         * XÁC THỰC SUPABASE OTP
         */

        const {
            data,
            error
        } =
        await supabase.auth.verifyOtp({

            email:pendingEmail,

            token:token,

            type:"email"

        });


        if(error)
            throw error;


        if(!data.session)
            throw new Error(
                "Không tạo được phiên đăng nhập."
            );


        currentUser =
        data.user;


        const email =
        (
            currentUser.email || ""
        ).toLowerCase();


        isAdmin =
        email === ADMIN_EMAIL;


        /*
         * ADMIN:
         * bỏ qua OTP sự kiện
         */

        if(!isAdmin){

            /*
             * ĐƯA OTP ĐÃ XÁC THỰC
             * QUA EDGE FUNCTION
             */

            const {
                data:verifyData,
                error:verifyError
            } =
            await supabase.functions.invoke(
                VERIFY_FUNCTION,
                {
                    body:{
                        email:pendingEmail,
                        otp:token
                    }
                }
            );


            if(verifyError)
                throw verifyError;


            if(
                verifyData &&
                verifyData.ok === false
            ){

                throw new Error(
                    verifyData.error ||
                    "OTP sự kiện không hợp lệ."
                );
            }
        }


        await enterGame();


    }catch(error){

        message(
            "otpMessage",
            error.message ||
            "OTP không hợp lệ.",
            "error"
        );

    }finally{

        document
        .getElementById("verifyOtpBtn")
        .disabled = false;
    }
}


/* =====================================================
   ENTER GAME
===================================================== */

async function enterGame(){

    if(!currentUser)
        return;


    /*
     * KHÔNG CHO VÀO GAME TRƯỚC NGÀY SỰ KIỆN
     */

    if(!eventOpen()){

        showLogin();

        showEventStatus();

        await loadLeaderboard();

        return;
    }


    /*
     * NGƯỜI CHƠI BÌNH THƯỜNG
     * PHẢI CÓ OTP HÔM NAY
     */

    if(!isAdmin){

        const {
            data,
            error
        } =
        await supabase.rpc(
            "has_event_otp_today",
            {
                p_user_id:
                currentUser.id
            }
        );


        if(error)
            throw error;


        if(!data){

            showLogin();

            message(
                "loginMessage",
                "Bạn chưa xác thực OTP hôm nay.",
                "error"
            );

            return;
        }
    }


    await loadPlayerState();

    createCards();

    showGame();

    await loadLeaderboard();


    if(isAdmin){

        message(
            "gameMessage",
            "👑 ADMIN — OTP sự kiện và giới hạn IP được bỏ qua. Lượt chơi và điểm vẫn ghi thật.",
            "success"
        );

    }else{

        message(
            "gameMessage",
            "✅ Xác thực thành công. Bạn có 50 lượt mỗi ngày.",
            "success"
        );
    }
}


/* =====================================================
   PLAYER STATE
===================================================== */

async function loadPlayerState(){

    const {
        data,
        error
    } =
    await supabase.rpc(
        "get_player_state"
    );


    if(error)
        throw error;


    const state =
    typeof data === "string"
    ? JSON.parse(data)
    : data;


    document
    .getElementById("playsRemaining")
    .textContent =
    state.plays_remaining ?? 50;


    document
    .getElementById("totalPoints")
    .textContent =
    state.points ?? 0;
}


/* =====================================================
   CREATE 10 CARDS
===================================================== */

function createCards(){

    const container =
    document.getElementById("cards");

    container.innerHTML = "";

    flippedCards = 0;


    for(
        let i = 0;
        i < 10;
        i++
    ){

        const card =
        document.createElement("button");


        card.type =
        "button";


        card.className =
        "card";


        card.innerHTML =
        "🃏";


        card.addEventListener(
            "click",
            () => flipCard(card)
        );


        container.appendChild(card);
    }


    document
    .getElementById("instruction")
    .textContent =
    "Hãy lật thẻ.";
}


/* =====================================================
   FLIP CARD
===================================================== */

async function flipCard(card){

    if(
        processing ||
        !currentUser ||
        !eventOpen()
    )
        return;


    processing = true;


    document
    .querySelectorAll(".card")
    .forEach(
        c => c.disabled = true
    );


    message(
        "gameMessage",
        "Đang xử lý lượt chơi..."
    );


    try{

        /*
         * QUAN TRỌNG:
         *
         * KHÔNG gọi flip_card()
         *
         * Browser chỉ gọi:
         *
         * flip-event-2026
         *
         * Edge Function mới gọi
         * process_event_flip_service()
         */

        const {
            data,
            error
        } =
        await supabase.functions.invoke(
            FLIP_FUNCTION,
            {
                body:{}
            }
        );


        if(error)
            throw error;


        const result =
        typeof data === "string"
        ? JSON.parse(data)
        : data;


        if(result.error)
            throw new Error(
                result.error
            );


        /*
         * HIỂN THỊ KẾT QUẢ
         */

        card.classList.add(
            "revealed"
        );


        if(result.has_point){

            card.innerHTML = `
                <span class="points win">
                    +${result.points_awarded}
                </span>
            `;


            message(
                "gameMessage",
                "🎉 Bạn nhận được " +
                result.points_awarded +
                " điểm!",
                "success"
            );

        }else{

            card.innerHTML = `
                <span class="points zero">
                    0
                </span>
            `;


            message(
                "gameMessage",
                "😢 Lá này không có điểm."
            );
        }


        flippedCards++;


        /*
         * CẬP NHẬT LƯỢT
         */

        document
        .getElementById(
            "playsRemaining"
        )
        .textContent =
        result.plays_remaining;


        /*
         * CẬP NHẬT ĐIỂM
         */

        document
        .getElementById(
            "totalPoints"
        )
        .textContent =
        result.points;


        /*
         * CẬP NHẬT TOP
         */

        await loadLeaderboard();


        /*
         * HẾT 50 LƯỢT
         */

        if(
            Number(result.plays_remaining)
            <= 0
        ){

            document
            .getElementById(
                "instruction"
            )
            .textContent =
            "Bạn đã dùng hết 50 lượt hôm nay.";

            return;
        }


        /*
         * ĐỦ 10 THẺ
         *
         * Chỉ reset 10 thẻ.
         *
         * KHÔNG reset lượt.
         */

        if(flippedCards >= 10){

            document
            .getElementById(
                "instruction"
            )
            .textContent =
            "🔄 Chuẩn bị 10 thẻ mới...";


            setTimeout(
                () => {

                    createCards();

                    message(
                        "gameMessage",
                        "🔄 10 thẻ mới. Tiếp tục lật."
                    );

                },
                700
            );

            return;
        }


        /*
         * Cho phép lật thẻ tiếp theo
         */

        document
        .querySelectorAll(".card")
        .forEach(
            c => {

                if(
                    !c.classList.contains(
                        "revealed"
                    )
                ){

                    c.disabled =
                    false;
                }
            }
        );


    }catch(error){

        const text =
        error.message ||
        String(error);


        if(
            text.includes(
                "DA_DUNG_HET_50_LUOT"
            )
        ){

            document
            .getElementById(
                "playsRemaining"
            )
            .textContent =
            "0";


            message(
                "gameMessage",
                "Bạn đã dùng hết 50 lượt hôm nay.",
                "error"
            );


        }else if(
            text.includes(
                "OTP_CHUA_XAC_NHAN_HOM_NAY"
            )
        ){

            showLogin();

            message(
                "loginMessage",
                "Bạn chưa xác thực OTP hôm nay.",
                "error"
            );


        }else if(
            text.includes(
                "IP_ALREADY_USED"
            )
        ){

            message(
                "gameMessage",
                "❌ IP này đã được sử dụng cho tài khoản khác.",
                "error"
            );


        }else{

            message(
                "gameMessage",
                "❌ Không thể lật thẻ: " +
                text,
                "error"
            );
        }


        document
        .querySelectorAll(".card")
        .forEach(
            c => c.disabled = false
        );

    }finally{

        processing = false;
    }
}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard(){

    const {
        data,
        error
    } =
    await supabase.rpc(
        "get_leaderboard"
    );


    const box =
    document.getElementById(
        "leaderboard"
    );


    if(error){

        box.innerHTML =
        `<div class="error">
            ${error.message}
        </div>`;

        return;
    }


    if(
        !data ||
        data.length === 0
    ){

        box.innerHTML =
        "Chưa có người chơi có điểm.";

        return;
    }


    let html = `
        <table>

        <thead>

        <tr>
            <th>#</th>
            <th>Người chơi</th>
            <th>Điểm</th>
        </tr>

        </thead>

        <tbody>
    `;


    data.forEach(
        (row,index) => {

            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                            row.display_name ||
                            row.email ||
                            "Người chơi"
                        )}
                    </td>

                    <td>
                        <b>
                            ${Number(
                                row.points || 0
                            ).toLocaleString(
                                "vi-VN"
                            )}
                        </b>
                    </td>

                </tr>
            `;
        }
    );


    html += `
        </tbody>
        </table>
    `;


    box.innerHTML =
    html;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabase.auth.signOut();

    currentUser = null;

    pendingEmail = "";

    isAdmin = false;

    flippedCards = 0;

    document
    .getElementById("emailInput")
    .value = "";

    document
    .getElementById("otpInput")
    .value = "";

    showLogin();
}

/* =====================================================
   RESTORE SESSION
===================================================== */

supabase.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if(
            session &&
            (
                event ===
                "INITIAL_SESSION" ||

                event ===
                "SIGNED_IN"
            )
        ){

            try{

                currentUser =
                session.user;


                isAdmin =
                (
                    currentUser.email ||
                    ""
                ).toLowerCase()
                ===
                ADMIN_EMAIL;


                /*
                 * Admin:
                 * bỏ qua OTP sự kiện.
                 */

                if(!isAdmin){

                    const {
                        data,
                        error
                    } =
                    await supabase.rpc(
                        "has_event_otp_today",
                        {
                            p_user_id:
                            currentUser.id
                        }
                    );


                    if(
                        error ||
                        !data
                    ){

                        showLogin();

                        return;
                    }
                }


                await enterGame();


            }catch(error){

                showLogin();

                message(
                    "loginMessage",
                    error.message ||
                    "Không thể khôi phục phiên.",
                    "error"
                );
            }
        }
    }
);


/* =====================================================
   INIT
===================================================== */

(async function(){

    /*
     * CỰC KỲ QUAN TRỌNG:
     *
     * Khi mở web lần đầu,
     * KHÔNG HIỆN GAME.
     *
     * Chỉ hiện LOGIN.
     */

    showLogin();


    const {
        data
    } =
    await supabase.auth.getSession();


    if(data.session){

        currentUser =
        data.session.user;


        isAdmin =
        (
            currentUser.email ||
            ""
        ).toLowerCase()
        ===
        ADMIN_EMAIL;


        try{

            await enterGame();

        }catch(error){

            showLogin();

            message(
                "loginMessage",
                error.message ||
                "Không thể đăng nhập.",
                "error"
            );
        }
    }

})();
